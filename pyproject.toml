[project]
name = "dist-jax"
version = "0.1.0"
description = "Distributed Training with JAX - course notebooks"
requires-python = ">=3.10"
dependencies = [
    "jax[cpu]",
    "optax",
    "numpy",
    "equinox>=0.13.7",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "jupytext",
    "jupyter",
    "notebook",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.jupytext]
formats = "src/chapters//py:percent,notebooks//ipynb"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["judge"]
package-dir = {"" = "src", "tests" = "tests"}
packages = ["chapters", "exercises", "tests"]
